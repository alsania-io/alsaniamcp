# Pixi configuration for AlsaniaMCP Python dependencies
# This replaces traditional virtual environment setups with a more modern approach

[project]
name = "alsaniamcp-python"
description = "Python dependencies for AlsaniaMCP - Universal MCP proxy server"
authors = ["Alsania Team <team@alsania.io>"]
version = "1.0.0"
license = "MIT"

# Python version specification
[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "win-64"]

# Main Python environment
[tool.pixi.dependencies]
python = "3.10.*"

# FastAPI and related dependencies for the router
fastapi = ">=0.95.0"
uvicorn = ">=0.22.0"

# Development dependencies
[tool.pixi.dev-dependencies]
pytest = ">=7.0.0"
black = ">=23.0.0"
isort = ">=5.0.0"

# Environment configuration
[tool.pixi.environment]
# Set environment variables for the Python environment
PYTHONPATH = ".:${PYTHONPATH}"

# Tasks/aliases for common operations
[tool.pixi.tasks]

# Start the FastAPI router server
start-router = "uvicorn router:app --host 0.0.0.0 --port 8000 --reload"

# Run the router without reload (production)
start-router-prod = "uvicorn router:app --host 0.0.0.0 --port 8000"

# Run tests
test = "pytest tests/ -v"

# Format code
format = "black . && isort ."

# Lint code (would need additional dependencies)
lint = "echo 'Add your linting commands here'"

# Show environment info
info = "python --version && pip list"

# Test Pixi setup
test-pixi = "python test_pixi_setup.py"

# Pixi features
[tool.pixi.feature]

# Default feature - includes all basic dependencies
default = []

# Development feature - includes dev dependencies
development = ["dev-dependencies"]

# System requirements
[system-requirements]
linux = "3.10"
macos = "10.15"

# Pixi configuration
[tool.pixi.settings]
# Use a shared environment directory
virtualenv-dir = ".pixi-env"

# Allow pixi to manage the environment
manage-env = true
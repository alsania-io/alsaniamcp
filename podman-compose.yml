# Podman-specific Compose configuration for AlsaniaMCP
# This file uses Podman-specific features and optimizations
#
# To use:
#   podman-compose -f podman-compose.yml up -d
#
# Or with newer Podman versions:
#   podman compose -f podman-compose.yml up -d

version: '3.8'

services:
  alsaniamcp:
    build: .
    image: alsaniamcp/mcp:latest
    container_name: alsaniamcp-server
    ports:
      - "5050:5050"
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:-}
    volumes:
      - ./config:/app/config:Z
      - ./data:/app/data:Z
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Podman-specific security and performance optimizations
    security_opt:
      - no-new-privileges
      - seccomp=unconfined
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    userns: keep-id
    tmpfs:
      - /tmp:size=100M,mode=1777
    devices:
      - /dev/null
    dns:
      - 1.1.1.1
      - 8.8.8.8
    dns_search:
      - .
    # Resource limits
    cpus: 2
    memory: 1G
    memory_swap: 1.5G
    # Podman-specific network configuration
    networks:
      - alsaniamcp-net

# Podman-specific network configuration
networks:
  alsaniamcp-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

# Podman volume configuration (using local paths instead of named volumes)
volumes:
  alsaniamcp-data:
    driver: local
    driver_opts:
      type: none
      device: ./data
      o: bind
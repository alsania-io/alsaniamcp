# Podman/Docker Compose configuration for AlsaniaMCP
# This file is compatible with both podman-compose and docker-compose
#
# To use with Podman:
#   podman-compose up -d
#
# To use with Docker:
#   docker-compose up -d
#
# For Podman users, you can also use:
#   podman compose up -d

version: '3.8'

services:
  alsaniamcp:
    build: .
    image: alsaniamcp/mcp:latest
    container_name: alsaniamcp-server
    ports:
      - "5050:5050"
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:-}
    volumes:
      - ./config:/app/config
      - alsaniamcp-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Podman-specific security enhancements
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

volumes:
  alsaniamcp-data:
    # Podman volume driver configuration
    driver: local
    driver_opts:
      type: none
      device: ./data
      o: bind